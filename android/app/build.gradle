plugins { id 'com.android.application' }

android {
    namespace 'com.generalsx.generalszh'
    compileSdk 34
    defaultConfig {
        applicationId project.findProperty('GX_APP_ID') ?: 'com.generalsx.generalszh'
        minSdk 29
        targetSdk 29   // sideload-only: keeps requestLegacyExternalStorage effective
        // CI passes the workflow run number so every release installs over the last one.
        versionCode((project.findProperty('GX_VERSION_CODE') ?: '1') as int)
        versionName project.findProperty('GX_VERSION_NAME') ?: '1.04'
        ndk { abiFilters 'arm64-v8a' }
    }
    // Optional permanent signing key (CI: repository secrets, see release-android.yml).
    // Without it the debug build keeps the machine's own debug key.
    signingConfigs {
        if (project.hasProperty('GX_KEYSTORE')) {
            gxRelease {
                storeFile file(project.property('GX_KEYSTORE'))
                storePassword project.property('GX_KEYSTORE_PASSWORD')
                keyAlias project.property('GX_KEY_ALIAS')
                keyPassword project.property('GX_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            if (project.hasProperty('GX_KEYSTORE')) {
                signingConfig signingConfigs.gxRelease
            }
        }
    }
    // GeneralsX @build FadiLabib 07/07/2026 - adrenotools REQUIRES legacy packaging.
    // With the modern (default) packaging Android leaves native libs compressed in
    // the APK and nativeLibraryDir points inside the .apk, so adrenotools' hookLibDir
    // (which must be a real directory holding libhook_impl.so / libmain_hook.so) is
    // invalid and the Turnip hook silently fails (0 devices). useLegacyPackaging=true
    // extracts all jniLibs to a real nativeLibraryDir on install. See
    // adrenotools_open_libvulkan docs ("app MUST be packaged w/ useLegacyPackaging = true").
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    // JavaSteam (in-app Steam download) is built for Java 17.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            // Duplicate metadata from the JavaSteam/ktor/okhttp dependency jars.
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*',
                         'META-INF/NOTICE*', 'META-INF/*.kotlin_module', 'META-INF/versions/9/previous-compilation-data.bin']
        }
    }
    sourceSets.main {
        jniLibs.srcDirs = ['jniLibs']       // populated by package-android-zh.sh
        java.srcDirs = ['src/main/java', 'sdl-java']  // sdl-java copied from SDL3 source
    }
}

dependencies {
    // In-app download of the user's own Zero Hour copy from Steam (SetupActivity).
    implementation 'in.dragonbra:javasteam:1.8.0'
    implementation 'in.dragonbra:javasteam-depotdownloader:1.8.0'
    // JavaSteam declares its depot-chunk decompressors compileOnly; supply them here.
    // zstd-jni's .aar carries the Android native libraries (the plain jar has desktop ones only).
    implementation 'com.github.luben:zstd-jni:1.5.7-4@aar'
    implementation 'org.tukaani:xz:1.10'
}
