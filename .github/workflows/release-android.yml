name: Release Android APK

# Builds the arm64 Android APK (sideload-only) with the same scripts a dev uses
# locally (docs/BUILD/ANDROID.md), then:
#   - on any run: uploads the APK as a workflow artifact
#   - on an android-v* tag: publishes it as a GitHub Release under that tag
#   - on a successful push to the Android port branch, or a manual "Run workflow"
#     (e.g. right after adding the signing secrets): publishes a new GitHub
#     Release "android-r<run number>" (marked latest)
# The APK contains NO game assets — players supply their own Zero Hour data.
#
# Signing: Android only installs an update signed with the same key as the
# installed app. Set these repository secrets to sign every build with one
# permanent key (see docs/BUILD/ANDROID.md, "Release signing"):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD
# Without them each build is signed with the runner's throwaway debug key, and
# updating requires uninstalling first (which deletes the app's game data).

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
    # Each successful push to the Android port branch publishes a release.
    branches: ['claude/cloud-vs-device-access-hhykct']
    # Commits that only change the Super Patch build don't change the app.
    paths-ignore: ['.github/workflows/build-super-patch.yml']

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # Only the two submodules the Android build needs (references/ holds more).
      # cmake inits fbraz3-dxvk's nested submodules and applies the Android patch itself.
      - name: Init required submodules
        run: |
          git submodule update --init --recursive references/libadrenotools
          git submodule update --init references/fadi-labib-dxvk

      # vcpkg builds FFmpeg/OpenAL for arm64-android from source; the runner's
      # 14 GB free disk is tight, so drop the biggest unused preinstalled toolchains.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL

      - name: Install host tools (meson, glslang for DXVK shader compile)
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build glslang-tools nasm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK r27 LTS
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" 'platforms;android-34' 'build-tools;34.0.0' >/dev/null

      # package-android-zh.sh drives a bare `gradle` (no wrapper checked in); pin 8.9
      # to match AGP 8.5.2 rather than trust the runner's preinstalled version.
      - name: Set up Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: vcpkg (full clone required by overlay triplet)
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"

      # vcpkg's default binary cache: first run builds arm64-android deps (~1-2 h),
      # later runs restore them in minutes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'cmake/triplets/arm64-android.cmake') }}
          restore-keys: vcpkg-android-

      - name: Build libmain.so + DXVK + Turnip + adrenotools
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          export VCPKG_ROOT="$HOME/vcpkg"
          ./scripts/build/android/fetch-turnip.sh
          ./scripts/build/android/build-adrenotools.sh
          cmake --preset android-vulkan
          # dxvk_d3d8_install builds the DXVK external project and copies
          # libdxvk_d3d8/d3d9.so to the build root where package-android-zh.sh expects them.
          cmake --build build/android-vulkan --target z_generals dxvk_d3d8_install -j"$(nproc)"

      # Release name and Android versionCode. versionCode must grow with every
      # release or Android refuses to install it over the previous one.
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=android-r$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
          echo "ORG_GRADLE_PROJECT_GX_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_GX_VERSION_NAME=1.04-r$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: signing with the runner's throwaway debug key. Installing this APK over an earlier one will need an uninstall first."
            echo "SIGNING_NOTE=Signed with a throwaway debug key: uninstall the previous version before installing (this deletes downloaded game files)." >> "$GITHUB_ENV"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "ORG_GRADLE_PROJECT_GX_KEYSTORE=$keystore"
            echo "ORG_GRADLE_PROJECT_GX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_GX_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_GX_KEY_PASSWORD=$KEY_PASSWORD"
            echo "SIGNING_NOTE=Signed with the project's release key: installs as an update over earlier releases."
          } >> "$GITHUB_ENV"

      - name: Package APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          export VCPKG_ROOT="$HOME/vcpkg"
          ./scripts/build/android/package-android-zh.sh
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "GeneralsZH-${RELEASE_TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-Android-apk
          path: GeneralsZH-*.apk

      # The APK's native libraries are stripped; these unstripped copies turn the
      # "lib+offset" frames of an on-device crash report (game.log / "Save logs")
      # into function names and source lines (llvm-addr2line / llvm-symbolizer).
      - name: Native symbols
        run: |
          tar -C android/app/jniLibs -I 'xz -T0 -6' -cf "GeneralsZH-symbols-${RELEASE_TAG}.tar.xz" arm64-v8a
          ls -lh "GeneralsZH-symbols-${RELEASE_TAG}.tar.xz"

      # Runs only when every step above succeeded (the default for steps).
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Android APK for Command & Conquer Generals: Zero Hour (arm64)."
            echo
            echo "Built from \`${GITHUB_SHA::7}\`: $(git log -1 --format=%s "$GITHUB_SHA")"
            echo
            echo "- **You need your own copy of Zero Hour.** On first launch the app downloads it from your Steam account or imports it from a folder; this APK ships no game assets."
            echo "- Needs an arm64 device; Qualcomm Adreno GPUs are the best supported."
            echo "- ${SIGNING_NOTE}"
          } > "$notes"
          # A release created with GITHUB_TOKEN does not trigger another workflow run.
          gh release create "$RELEASE_TAG" GeneralsZH-*.apk GeneralsZH-symbols-*.tar.xz \
            --target "$GITHUB_SHA" \
            --title "Android ${RELEASE_TAG#android-}" \
            --notes-file "$notes" \
            --latest
